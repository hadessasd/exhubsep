# Render Blueprint — connect this repo at https://dashboard.render.com/blueprints
services:
  - type: web
    name: examhub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SERIAL_ENCRYPTION_KEY
        sync: false
